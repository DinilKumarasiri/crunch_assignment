name: tests

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: breaks
          POSTGRES_USER: breaks
          POSTGRES_PASSWORD: breaks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breaks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: breaks
      POSTGRES_USER: breaks
      POSTGRES_PASSWORD: breaks
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest --create-db --cov=accounts --cov=breaks --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json     
      - run: npm ci
      - run: |
          ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")
          npm install --no-save --no-package-lock "@rolldown/binding-linux-x64-gnu@${ROLLDOWN_VERSION}"
      - run: npm test
      - run: npm run build


      